<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>东坡 · AI 对话 | 苏轼</title>
<meta name="description" content="与苏东坡对话：月色、风雨与生活里的小欢喜。可语音、可打字，课后拓展互动页。">
<meta name="theme-color" content="#12100d">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="scene" id="scene">

  <img class="bg" src="assets/bg.jpg" alt="" aria-hidden="true">
  <div class="wash" aria-hidden="true"></div>

  <div class="figure-wrap" aria-hidden="true">
    <video class="figure" id="figure" autoplay muted loop playsinline preload="auto" poster="assets/poster.jpg">
      <source src="assets/figure.webm" type="video/webm">
      <source src="assets/figure.mp4" type="video/mp4">
    </video>
  </div>

  <header class="hud">
    <div class="brand">
      <span class="seal" aria-hidden="true">轼</span>
      <span class="brand-text">
        <b>东坡</b>
        <i>AI 对话 · 课后拓展</i>
      </span>
    </div>
    <div class="hud-actions">
      <button class="icon-btn" id="btnMute" type="button" aria-pressed="false" title="静音 / 取消静音">
        <svg class="ico on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15 9.5a3.5 3.5 0 0 1 0 5"/><path d="M17.5 7a7 7 0 0 1 0 10"/></svg>
        <svg class="ico off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="m16 9 4 6M20 9l-4 6"/></svg>
        <span class="sr">静音</span>
      </button>
      <button class="icon-btn" id="btnFull" type="button" title="全屏">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/></svg>
        <span class="sr">全屏</span>
      </button>
    </div>
  </header>

  <div class="chips" id="chips" role="group" aria-label="推荐问题"></div>
  <button class="shuffle" id="btnShuffle" type="button">换一批问题 ↻</button>

  <section class="panel" aria-label="对话">
    <div class="panel-head">
      <span class="avatar" aria-hidden="true">东</span>
      <span class="who-block">
        <b>苏轼</b>
        <i>字子瞻，号东坡居士</i>
      </span>
      <span class="live"><span class="dot" aria-hidden="true"></span>语音对话</span>
    </div>

    <div class="log" id="log" aria-live="polite" aria-atomic="false"></div>

    <div class="player" id="player" hidden>
      <button class="pbtn" id="btnPlay" type="button" aria-label="播放/暂停">▶</button>
      <div class="bar" id="bar" role="slider" tabindex="0" aria-label="语音进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <i id="barFill"></i>
      </div>
      <span class="time" id="time">0:00</span>
      <button class="pbtn small" id="btnReplay" type="button">重播</button>
      <button class="pbtn small" id="btnSpeed" type="button">1.0×</button>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <input id="ask" name="ask" type="text" placeholder="问东坡一个问题…" aria-label="输入你的问题" maxlength="60">
      <button type="submit">发送</button>
    </form>

    <p class="disclaimer">声音由 AI 合成 · 内容为教学演示，非真实史料问答</p>
  </section>

  <div class="start" id="start">
    <div class="start-card">
      <span class="seal big" aria-hidden="true">轼</span>
      <h1>与东坡对话</h1>
      <p>月色、风雨、读书与人生<br>点一下，听听他怎么说</p>
      <button id="btnStart" type="button">开始对话</button>
      <small>建议戴耳机 · 约 3 分钟</small>
    </div>
  </div>

</div>

<script src="dialogues.js"></script>
<script src="app.js"></script>
</body>
</html>
